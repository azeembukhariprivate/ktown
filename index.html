<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>KTOWN</title>
  <meta name="description" content="Walk around a little Kerala town with Inaara. A free 3D game that plays in your browser, on a computer or a phone.">
  <meta name="theme-color" content="#1b130c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KTOWN">
  <meta property="og:title" content="KTOWN">
  <meta property="og:description" content="Walk around a little Kerala town with Inaara.">
  <meta property="og:image" content="assets/icons/icon-512.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <style>
    @font-face {
      font-family: Fredoka;
      src: url(assets/fonts/Fredoka.ttf) format('truetype');
      font-weight: 300 700;
      font-display: block;
    }
    :root {
      --accent: #ff9f1c;
      --ink: #fff6e6;
      --card: rgba(28, 18, 10, 0.94);
    }
    html, body {
      margin: 0;
      height: 100%;
      background: #1b130c;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: Fredoka, system-ui, sans-serif;
      color: var(--ink);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas#game {
      display: block;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      touch-action: none;
      outline: none;
    }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #ui .screen, #ui .hud > * { pointer-events: auto; }
    #ui .hud { position: absolute; inset: 0; pointer-events: none; }
    .screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .loading { background: radial-gradient(circle at 50% 40%, #3a2412, #120b06); flex-direction: column; gap: 18px; }
    .logo { font-weight: 700; font-size: 56px; letter-spacing: 6px; color: #ffcf5e; text-shadow: 0 4px 0 #7a3f0a, 0 8px 24px rgba(0,0,0,.5); }
    .logo.big { font-size: clamp(56px, 11vw, 120px); }
    .portrait { width: 140px; height: 180px; object-fit: cover; border-radius: 50% 50% 46% 46%; border: 4px solid var(--accent); }
    .bar { width: min(360px, 70vw); height: 14px; border-radius: 7px; background: rgba(255,255,255,.12); overflow: hidden; }
    .bar-fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffcf5e, var(--accent)); transition: width .2s; }
    .small { font-size: 15px; opacity: .85; line-height: 1.45; }
    .title { background: linear-gradient(90deg, rgba(20,12,6,.72) 0%, rgba(20,12,6,.35) 45%, rgba(20,12,6,0) 70%); justify-content: flex-start; pointer-events: none !important; }
    .title-box { margin-left: max(5vw, 24px); display: flex; flex-direction: column; gap: 14px; pointer-events: auto; }
    .tag { font-size: clamp(17px, 2.2vw, 24px); text-shadow: 0 2px 8px rgba(0,0,0,.7); }
    .title-portrait { position: absolute; right: 7vw; top: 50%; transform: translateY(-50%); width: min(28vw, 300px); aspect-ratio: 240 / 309; object-fit: cover; border-radius: 50% 50% 46% 46%; border: 5px solid var(--accent); box-shadow: 0 14px 40px rgba(0,0,0,.55); pointer-events: none; }
    .buttons { display: flex; flex-direction: column; gap: 10px; align-items: stretch; width: min(320px, 80vw); }
    button {
      font: 600 20px Fredoka, system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.25); border-radius: 14px; padding: 11px 18px; cursor: pointer;
    }
    button:hover, button:focus-visible { background: rgba(255,255,255,.22); outline: none; border-color: #ffcf5e; }
    button.main { background: var(--accent); border-color: #ffcf5e; color: #2a1505; }
    button.main:hover { background: #ffb347; }
    button.chosen { background: #ffcf5e; color: #2a1505; border-color: #ffcf5e; }
    .card-screen { background: rgba(10,6,3,.45); }
    .card { background: var(--card); border: 2px solid rgba(255,207,94,.4); border-radius: 22px; padding: 22px 26px; width: min(640px, 88vw); max-height: 86vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 10px; }
    .card h2 { margin: 0 0 4px; color: #ffcf5e; font-size: 30px; }
    .card h3 { margin: 6px 0 2px; color: #ffcf5e; font-size: 19px; }
    .card p, .card li { font-size: 17px; line-height: 1.45; margin: 4px 0; }
    .card ul { margin: 0; padding-left: 20px; }
    .card a { color: #ffcf5e; }
    .card .buttons { width: 100%; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
    .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .setting > span { font-size: 18px; }
    .choices { display: flex; gap: 6px; flex-wrap: wrap; }
    .choices button { font-size: 16px; padding: 7px 12px; }
    input[type=range] { width: min(240px, 50vw); accent-color: var(--accent); }
    .credit { font-size: 20px !important; }
    .heart { color: var(--accent); }
    .pause-btn { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); width: 48px; height: 48px; padding: 0; font-size: 16px; border-radius: 50%; background: rgba(0,0,0,.35); }
    .toast { position: absolute; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translate(-50%, -20px); background: rgba(20,12,6,.72); border: 2px solid rgba(255,207,94,.5); padding: 8px 18px; border-radius: 999px; font-size: 20px; opacity: 0; transition: opacity .4s, transform .4s; pointer-events: none !important; max-width: 80vw; text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .stick-base { position: absolute; left: 110px; top: calc(100% - 130px); width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.35); opacity: .35; pointer-events: none !important; }
    .stick-knob { position: absolute; left: 30px; top: 30px; width: 60px; height: 60px; border-radius: 50%; background: rgba(255,207,94,.75); }
    .jump-btn { position: absolute; right: max(28px, env(safe-area-inset-right)); bottom: max(34px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; background: rgba(255,159,28,.55); font-size: 20px; padding: 0; }
    @media (max-height: 500px) {
      .logo.big { font-size: 52px; }
      .buttons { gap: 6px; }
      button { font-size: 17px; padding: 7px 14px; }
      .title-portrait { width: min(26vw, 220px); right: 4vw; }
      .card { padding: 14px 18px; max-height: 90vh; }
      .card h2 { font-size: 24px; }
    }
    @media (max-aspect-ratio: 1/1) {
      .title { background: linear-gradient(0deg, rgba(20,12,6,.8) 0%, rgba(20,12,6,.3) 55%, rgba(20,12,6,0) 80%); align-items: flex-end; justify-content: center; }
      .title-box { margin: 0 0 6vh; align-items: center; text-align: center; }
      .title-portrait { right: auto; left: 50%; top: 8vh; transform: translateX(-50%); width: min(52vw, 260px); }
    }
    noscript { color: var(--ink); font: 20px sans-serif; display: block; padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="KTOWN game"></canvas>
  <div id="ui"></div>
  <noscript>KTOWN needs JavaScript switched on to play.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
